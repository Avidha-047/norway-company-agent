name: Build company profiles

on:
  workflow_dispatch:
    inputs:
      count:
        description: "How many random companies to profile"
        default: "1100"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline tests
        run: python -m unittest discover -s tests -v
      - name: Build profiles
        run: python agent.py --sample ${{ github.event.inputs.count }} --seed 2026 --out profiles --time-limit 16000
      - name: Commit profiles
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add profiles
          git commit -m "Add generated company profiles" || echo "nothing to commit"
          git push
